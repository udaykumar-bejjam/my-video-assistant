name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - master

permissions:
  contents: write

jobs:
  build-macos:
    name: Build CaptionStudio.app
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | grep macosx || true

      - name: Build macOS Release
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptionStudio-macOS
          path: build/dist/CaptionStudio-macOS.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event_name == 'workflow_dispatch' && format('macos-build-{0}', github.run_number) || 'v1.0.30') }}
          name: CaptionStudio macOS ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event_name == 'workflow_dispatch' && format('build {0}', github.run_number) || 'v1.0.30') }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            build/dist/CaptionStudio-macOS.zip
          body: |
            ## CaptionStudio for macOS

            Download **CaptionStudio-macOS.zip**, unzip, then **right-click → Open** the first time (ad-hoc signed).

            ### v1.0.30
            - **Chess VO / video clock sync**: Mark start/end on the project timeline
            - **Fixed pace** or **Fit to range** spaces ply times for overlay + SFX
            - Attach / Retarget clock rebuilds keyframes without re-analyzing

            ### v1.0.29
            - **Preview SFX on play**: cues fire as the playhead crosses them
            - Dialogue duck applies in preview when Duck under SFX is on
            - Pause stops one-shot SFX; Audio layer toggle to disable preview mix

            ### v1.0.28
            - **1:1 square** canvas (1080×1080) for IG feed
            - Batch export remaps overlays (and chess board) via safe-zone mapping across 9:16 / 16:9 / 1:1
            - Switching aspect in Export remaps live overlays (undoable)

            ### v1.0.27
            - **Chess Walkthrough**: paste PGN → animated move-by-move board replay
            - Color callouts for Brilliant / Good / Book / Interesting / Mistake / Blunder / Critical
            - Arrows, square highlights, overlay text, and SFX per move category
            - Open from Home (**Chess Walkthrough**) or the editor checkerboard button

            ### v1.0.26
            - Timeline zoom + cross-lane drag

            - Requires **macOS 14+**
            - Telugu: Add API Key → తెలుగు + EN → AI Captions
            - Optional enhancer: `cd enhancer-server && npm install && npm start`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
