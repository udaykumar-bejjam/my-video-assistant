name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - master

permissions:
  contents: write

jobs:
  build-macos:
    name: Build CaptionStudio.app
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | grep macosx || true

      - name: Build macOS Release
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptionStudio-macOS
          path: build/dist/CaptionStudio-macOS.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event_name == 'workflow_dispatch' && format('macos-build-{0}', github.run_number) || 'v1.0.10') }}
          name: CaptionStudio macOS ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event_name == 'workflow_dispatch' && format('build {0}', github.run_number) || 'v1.0.10') }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            build/dist/CaptionStudio-macOS.zip
          body: |
            ## CaptionStudio for macOS

            Download **CaptionStudio-macOS.zip**, unzip, then **right-click → Open** the first time (ad-hoc signed).

            ### v1.0.10
            - Rebuild on macos-15 runners (fixes cancelled macos-14 queue)
            - Audio layer with enhancers + SFX mix controls
            - Project save/load (JSON) with resume playhead/tab/selections
            - Fix export caption split after ~10s

            - Requires **macOS 14+**
            - Optional enhancer: `cd enhancer-server && npm install && npm start`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
